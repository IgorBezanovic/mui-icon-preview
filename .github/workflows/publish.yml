name: Publish extension

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Include version commits from earlier runs, even when this run was queued.
          ref: master
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Check Entra configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [[ -z "$AZURE_CLIENT_ID" || -z "$AZURE_TENANT_ID" ]]; then
            echo '::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID in repository Actions secrets. See PUBLISHING.md.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sign in with Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify Marketplace publisher access
        run: |
          publisher=$(node -p "require('./package.json').publisher")
          npm exec --no -- vsce verify-pat "$publisher" --azure-credential

      - name: Check version consistency
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          assert.equal(lock.version, manifest.version, 'Update package-lock.json with npm version');
          assert.equal(lock.packages[''].version, manifest.version, 'Lockfile root version must match');
          NODE

      - name: Run extension tests
        run: xvfb-run -a npm test

      - name: Bump patch version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$(git log -1 --format=%s)" == "chore(release): v${version} [skip ci]" ]]; then
            echo "Retrying release ${version}; keeping the saved version."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            npm version patch --no-git-tag-version
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: npm run vsce:package -- --out extension.vsix

      - name: Save release version to master
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
          # Reserve the version before publishing; never force-push or rebase untested code.
          git push origin HEAD:master

      - name: Publish using Microsoft Entra ID
        run: npm run vsce:publish -- --packagePath extension.vsix --azure-credential --skip-duplicate
